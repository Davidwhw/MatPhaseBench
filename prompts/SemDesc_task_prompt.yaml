      ## EXAMPLE 2

      INPUT:
      - Input image: 
        The image 2.
      - Selected dimensions:
        materials_system
        diagram_type
        diagram_completeness
        phase_regions_boundaries
        invariant_reactions

      OUT:
      - selected_dimensions
        materials_system
        diagram_type
        diagram_completeness
        phase_regions_boundaries
        invariant_reactions
      - descriptions
        - materials_system
          The description concerns the Fe-Ni-Ti ternary system in the Ti-rich region above 50 at.% Ti. The investigated alloys include Fe-Ti, Ni-Ti, and Fe-Ni-Ti compositions, with the ternary alloys examined along three constant Ni:Fe atomic ratios of 1:3, 1:1, and 3:1.
        - diagram_type
          Three partial isopleths were established for the Fe-Ni-Ti ternary system along lines of constant Ni:Fe atomic ratio, specifically Ni:Fe = 1:3, 1:1, and 3:1. The description focuses particularly on the Ni:Fe = 1:1 isopleth and discusses phase equilibria as a function of temperature and Ti composition.
        - diagram_completeness
          The diagrams are partial isopleths restricted to the Ti-rich region above 50 at.% Ti rather than representations of the full Fe-Ni-Ti composition space. At lower temperatures below 800°C, the phase equilibria in the three isopleths are described as incomplete, and the boundaries of some two- or three-phase regions are tentative.
        - phase_regions_boundaries
          In the Ni:Fe = 1:1 isopleth, a three-phase equilibrium region containing L + βTi + (Fe,Ni)Ti (β1) is present at higher temperatures. The β1 phase is described as a solid solution of FeTi and NiTi. The L + βTi + β1 three-phase equilibrium extends from the Fe-Ti binary toward the Ni-Ti binary as the Ti content increases. At lower temperatures, the phase equilibria are less completely established. Boundaries of two- or three-phase regions are represented by dashed lines and are considered tentative rather than definitive.
        - invariant_reactions
          The L + βTi + β1 three-phase equilibrium in the Ti-rich region is associated with the eutectic reaction e4 originating from the Fe-Ti binary system. The results indicate that this three-phase equilibrium advances toward the Ni-Ti binary with increasing Ti content. A four-phase reaction designated U4 is also reported at 650°C, involving βTi + δ ↔ αTi + β1.
      - comprehensive_description
        The new ternary results at Ti > 50 at.% are from relevant research. Research arc melted Fe-Ti, Ni-Ti, and Fe-Ni-Ti alloys containing >50 at.% Ti under an inert environment. N-00 grade electrolytic Ni, Armco Fe, and iodide Ti were used. The FeNi-Ti alloys were prepared with varying Ti compositions along three different Ni:Fe atom ratios: 1:3, 1:1, and 3:1. The alloys in the as-cast as well as in the annealed states (800°C/100h and then 600°C/100h) were characterized through microstructural analyses, x-ray diffraction and thermal analyses. Three partial isopleths were established along the three lines of constant Ni:Fe ratio. The isopleth with Ni:Fe = 1:1 shows at the higher temperatures, three-phase equilibrium of L + βTi + (Fe,Ni)Ti (β1). The (Fe, Ni) Ti (β1) phase is the solid solution of FeTi and NiTi in each other. Since, in the >50 at.% Ti region, the L + βTi + β1, three-phase equilibrium originates from the eutectic reaction e4 in the Fe-Ti binary systems, the present results suggest that the three-phase equilibrium from the Fe-Ti binary advances toward the Ni-Ti binary as the Ti content of alloys increases. At the lower temperatures (<800°C), the phase equilibria in the three isopleths seem incomplete. The significant data at the lower temperatures are the presence of a four-phase reaction U4: βTi + δ ↔ αTi + β1 at 650°C. The boundaries of the two- or three-phase regions, given by dashed lines, possibly indicate what is to be expected but should be considered tentative.

