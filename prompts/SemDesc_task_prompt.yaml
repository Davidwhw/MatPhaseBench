specified_dimension_description_task:
  standard_description_task: |
    You are a materials science expert specializing in phase diagram interpretation.
    Your task is to describe a phase diagram image from a materials science paper as a materials science expert.

    The image may be a binary phase diagram, ternary phase diagram, isothermal section, vertical section, liquidus projection, liquidus surface, or element-rich region.

    # Selected dimensions:
    You must describe the image only from the selected dimensions listed below:

    {SELECTED_DIMENSIONS}

    # Dimension definitions

    {DIMENSION_DEFINITIONS}

    # Rules

    1. For each selected dimension, provide a complete and detailed description as much as possible.
    2. After describing each selected dimension separately, generate one comprehensive description that summarizes and integrates the information from all selected dimensions.
    3. The comprehensive description must be based only on the selected dimensions and must not introduce information that is not visible in the image.
    4. Preserve chemical formulas, phase labels, Greek letters, subscripts, superscripts, and mathematical symbols as faithfully as possible. Use LaTeX-style notation whenever possible, for example: Al$_2$O$_3$, Ni$_5$Zr, $\alpha$, $\beta$, $\gamma$, $\alpha$-Ti, L + $\beta$, and T$_m$.
    5. Never output an empty description for any selected dimension. For every selected dimension, make the best possible description strictly from visible image evidence. If the dimension cannot be fully determined, describe the relevant observable evidence, partial information, uncertainty, or limitation instead of leaving the field empty. Do not hallucinate information that is not visible in the image.
    6. Finally, generate a comprehensive_description that fully summarizes the selected dimensions without compressing or omitting important visible information.
    7. Output only valid JSON. Do not include any explanation outside the JSON.

    Return JSON in the following schema:

    {OUTPUT_SCHEMA}


  unlimited_description_task: |
      You are given a phase diagram image from a materials science paper.
      Describe the main information shown in the image.

      Rules:
      Focus on the most important visible features and provide a concise description.

      Return JSON in the following schema:

      {
        "diagram_description": <string>
      }


  few_shot_description_task:
    one_shot_description_task: |
      You are a materials science expert specializing in phase diagram interpretation.
      Your task is to describe a phase diagram image from a materials science paper as a materials science expert.

      The image may be a binary phase diagram, ternary phase diagram, isothermal section, vertical section, liquidus projection, liquidus surface, or element-rich region.

      # Selected dimensions:
      You must describe the image only from the selected dimensions listed below:

      {SELECTED_DIMENSIONS}

      # Dimension definitions

      {DIMENSION_DEFINITIONS}

      ## EXAMPLE

      INPUT:
      - Input image: 
        The image 1.
      - Selected dimensions:
        materials_system
        diagram_type
        diagram_completeness
        phase_regions_boundaries
        invariant_reactions

      OUT:
      - selected_dimensions
        materials_system
        diagram_type
        diagram_completeness
        phase_regions_boundaries
        invariant_reactions
      - descriptions
        - materials_system
          The description concerns the partial ternary system (Sb)–SbSn–(Pb), involving the phases (Pb), (Sb), (Sn), SbSn(HT), and SbSn(LT).
        - diagram_type
          The diagram shows the liquidus surface at the Pb-rich corner of the ternary system and contains internal boundaries represented by monovariant curves associated with eutectic separations and peritectic reactions.
        - diagram_completeness
          The diagram represents a partial ternary system and specifically reports the liquidus surface at the Pb-rich corner rather than the entire ternary system.
        - phase_regions_boundaries
          The internal boundaries include the monovariant curves e₁E and e₂E, which represent eutectic separations of (Pb) and (Sb), and of (Pb) and SbSn(LT), respectively. The curves p₁U₁, p₂U₁, and p₃U₂ are associated with peritectic reactions. Along U₁E, eutectic separation of (Sb) and SbSn(LT) occurs, while along e₂U₂ and U₂e₃, eutectic separations of (Pb) and SbSn(LT), and of (Pb) and (Sn), occur, respectively.
        - invariant_reactions
          The system contains a ternary eutectic E with an accepted temperature of 240 °C and a composition of 12 wt.% Sb and 4.0 wt.% Sn. Along p₁U₁, the peritectic reaction (Sb) + L ⇌ SbSn(HT) occurs; along p₂U₁, the peritectic reaction L + SbSn(HT) ⇌ SbSn(LT) occurs; and along p₃U₂, the peritectic reaction SbSn(LT) + L ⇌ (Sn) occurs. Eutectic separations occur along e₁E for (Pb) and (Sb), along e₂E for (Pb) and SbSn(LT), along U₁E for (Sb) and SbSn(LT), along e₂U₂ for (Pb) and SbSn(LT), and along U₂e₃ for (Pb) and (Sn). From U₁, the liquid separates into (Sb) and SbSn(LT) until solidification ends at the ternary eutectic point E.
      - comprehensive_description
        The partial ternary system (Sb)-SbSn-(Pb) is known to contain a ternary eutectic E. The accepted eutectic temperature and composition are 240 °C, 12 wt.% Sb, and 4.0 wt.% Sn. The figure reports the liquidus surface at the Pb-rich corner. Considering the internal boundaries of these areas, the monovariant curves e₁E and e₂E represent the eutectic separations of (Pb) and (Sb), and of (Pb) and SbSn(LT), respectively. Along p₁U₁, the peritectic reaction (Sb) + L ⇌ SbSn(HT) occurs; along p₂U₁, the peritectic reaction L + SbSn(HT) ⇌ SbSn(LT) occurs; along U₁E, the eutectic separation of (Sb) and SbSn(LT) occurs; along p₃U₂, the peritectic reaction SbSn(LT) + L ⇌ (Sn) occurs. Eutectic separations of (Pb) and SbSn(LT), and of (Pb) and (Sn), occur along the monovariant curves e₂U₂ and U₂e₃, respectively. From U₁, the liquid separates into (Sb) + SbSn(LT) until solidification ends at the ternary eutectic point E.

      # Rules
      1. For each selected dimension, provide a complete and detailed description as much as possible.
      2. After describing each selected dimension separately, generate one comprehensive description that summarizes and integrates the information from all selected dimensions.
      3. The comprehensive description must be based only on the selected dimensions and must not introduce information that is not visible in the image.
      4. Preserve chemical formulas, phase labels, Greek letters, subscripts, superscripts, and mathematical symbols as faithfully as possible using plain text and Unicode, for example: Al₂O₃, Ni₅Zr, α, β, γ, α-Ti, L + β, and Tₘ.
      5. Never output an empty description for any selected dimension. For every selected dimension, make the best possible description strictly from visible image evidence. If the dimension cannot be fully determined, describe the relevant observable evidence, partial information, uncertainty, or limitation instead of leaving the field empty. Do not hallucinate information that is not visible in the image.
      6. Finally, generate a comprehensive_description that fully summarizes the selected dimensions without compressing or omitting important visible information.
      7. Output only valid JSON. Do not include any explanation outside the JSON.

      Return JSON in the following schema:

      {OUTPUT_SCHEMA}

