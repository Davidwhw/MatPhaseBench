          The phase diagram description concerns the Zr-Nb binary system, focusing specifically on the solubility of Nb in alpha Zr and the Zr-rich composition range. The solubility of Nb in alpha Zr is evaluated as 0.6 at.% Nb in the temperature range associated with the monotectoid reaction.
        - phase_regions_boundaries
          The description discusses the alpha Zr phase region and the alpha + beta two-phase region, with particular attention to the alpha/(alpha + beta) phase boundary. The alpha/beta transition temperature in pure Zr is taken as 863 °C. The text notes that previously reported alpha/(alpha + beta) boundary compositions were considered too high in Nb content, possibly because true equilibrium was not achieved during resistivity measurements performed with increasing temperature. The composition of alpha Zr at the monotectoid reaction is taken as 0.6 at.% Nb.
        - invariant_reactio
          A monotectoid reaction is explicitly referenced in the description. In the temperature range of this reaction, the solubility of Nb in alpha Zr is evaluated as 0.6 at.% Nb, and the composition of alpha Zr at the monotectoid reaction is likewise taken to be 0.6 at.% Nb. The provided text does not specify the full reaction equation, all participating phases, or the exact monotectoid reaction temperature.
      - comprehensive_description
        Solubility of Nb in α Zr. Wide discrepancies exist regarding the solubility of Nb in α Zr. The experimental data of relevant research are considered here to be the most reliable. Thus, the solubility of Nb in α Zr is evaluated at 0.6 at.% Nb in the temperature range of the monotectoid reaction. The temperature accepted for the α/β transition in pure Zr is 863 °C. The solubility of Nb in α Zr is essentially that suggested by research. The numerical values adopted here are given in the section "Numerical Values for Phase Boundaries". Research reported the α/(α + β) boundary at too high Nb contents; this could be due to the lack of true equilibrium when resistivity data were obtained with rising temperature. The composition of (α Zr) at the monotectoid reaction is taken to be 0.6 at.% Nb.

