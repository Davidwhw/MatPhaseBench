      For this indicator, only the presence of the key information is judged. Whether the model describes that information factually correctly is not judged here; it is evaluated under Information Consistency.

      # Input Information

      ## Ground Truth
      The Ground Truth is the expert-annotated description of the phase diagram and is the only evaluation basis for this indicator:

      {GROUND_TRUTH}

      ## Semantic Dimensions
